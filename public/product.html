<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | NovaCart</title>
  <meta name="description" content="View product specifications, stock levels, and pricing at NovaCart.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span class="brand-icon">⚡</span>
        <span>NovaCart</span>
        <span class="brand-badge">CodeAlpha</span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/index.html#catalog" class="nav-link active">Catalog</a></li>
        <li><a href="/orders.html" class="nav-link">My Orders</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" id="nav-cart-btn" title="View Shopping Cart">
          <span>🛒</span>
          <span>Cart</span>
          <span class="cart-badge" id="nav-cart-badge" style="display: none;">0</span>
        </a>

        <div class="auth-nav" id="nav-auth-container">
          <a href="/login.html" class="btn btn-outline btn-sm">Login</a>
          <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Product Details Container -->
  <main class="container" style="padding-top: 1.5rem;">
    <div id="product-detail-container">
      <div style="text-align: center; padding: 4rem;">
        <div style="display: inline-block; width: 2.5rem; height: 2.5rem; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="color: #64748b; margin-top: 1rem;">Loading product specifications...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 NovaCart. Built for CodeAlpha Full Stack Web Development Internship.</p>
        <p>Demo Account: <strong>test@example.com</strong> / <strong>Password123!</strong></p>
      </div>
    </div>
  </footer>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/products.js"></script>
</body>
</html>
